<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Habitify">
  <defs>
    <linearGradient id="habitify-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="habitify-shine" x1="18" y1="10" x2="46" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="habitify-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App icon base -->
  <rect
    x="4"
    y="4"
    width="56"
    height="56"
    rx="16"
    fill="url(#habitify-bg)"
    filter="url(#habitify-soft)"
  />

  <!-- Soft top highlight -->
  <path
    d="M20 8.5C28 6.5 40 6.5 48 10C44 16 36 18.5 28 18C24 17.8 20.5 16.2 18 14C18.5 12 19 10 20 8.5Z"
    fill="url(#habitify-shine)"
  />

  <!-- Streak ring -->
  <circle
    cx="32"
    cy="32"
    r="16.5"
    stroke="#EDE9FE"
    stroke-opacity="0.28"
    stroke-width="3.5"
  />
  <path
    d="M32 15.5A16.5 16.5 0 1 1 18.2 42.8"
    stroke="#F5F3FF"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Check mark -->
  <path
    d="M23.5 32.2L29.2 37.8L41 25.5"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
